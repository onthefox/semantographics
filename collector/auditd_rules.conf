# auditd rules to capture exec/open/connect events for the LLM suspicion detector
# Install with: sudo cp auditd_rules.conf /etc/audit/rules.d/ && sudo augenrules --load

# Monitor execve system calls (process execution)
-a exit,always -F arch=b64 -S execve -k exec_monitor
-a exit,always -F arch=b32 -S execve -k exec_monitor

# Monitor open/openat system calls (file access)
-a exit,always -F arch=b64 -S open -S openat -k file_monitor
-a exit,always -F arch=b32 -S open -S openat -k file_monitor

# Monitor connect system calls (network connections)
-a exit,always -F arch=b64 -S connect -k network_monitor
-a exit,always -F arch=b32 -S connect -k network_monitor

# Monitor socket creation
-a exit,always -F arch=b64 -S socket -k socket_monitor
-a exit,always -F arch=b32 -S socket -k socket_monitor
